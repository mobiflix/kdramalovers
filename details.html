<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>MobiFlix — Details</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script defer src="auth.js?v=58"></script>

  <style>
    /* ============================================================
       RESET & BASE
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b0b0b;
      color: #e5e5e5;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body.locked { overflow: hidden; }

    /* ============================================================
       LOGIN SCREEN
       ============================================================ */
    .login-screen {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: #0b0b0b; padding: 20px;
    }
    .login-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(229,9,20,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(229,9,20,0.1) 0%, transparent 50%),
        #0b0b0b;
      pointer-events: none;
    }
    .login-box {
      position: relative; z-index: 2;
      background: rgba(20,20,20,0.95);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 40px 36px;
      width: 100%; max-width: 400px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.9);
    }
    .login-logo {
      display: block; text-align: center;
      color: #e50914; font-size: 32px; font-weight: 800;
      text-decoration: none; text-transform: uppercase;
      margin-bottom: 24px;
    }
    .login-logo span { color: #fff; }
    .login-box h2 {
      color: #fff; font-size: 24px; font-weight: 700;
      margin-bottom: 24px; text-align: center;
    }
    .login-field {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 14px 18px;
      margin-bottom: 14px; transition: 0.2s;
    }
    .login-field:focus-within { border-color: #e50914; }
    .login-field i { color: #888; width: 18px; }
    .login-field input {
      flex: 1; background: transparent; border: none;
      outline: none; color: #fff; font-size: 15px;
    }
    .login-field input::placeholder { color: #666; }
    .login-error {
      background: rgba(229,9,20,0.15);
      border: 1px solid rgba(229,9,20,0.4);
      color: #ff6b6b; font-size: 13px;
      padding: 10px 14px; border-radius: 8px;
      margin-bottom: 14px; text-align: center;
    }
    .login-btn {
      width: 100%; padding: 14px;
      background: #e50914; color: #fff;
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 700;
      cursor: pointer; transition: 0.2s;
    }
    .login-btn:hover { background: #ff0a16; }
    .login-note {
      color: #666; font-size: 12px;
      text-align: center; margin-top: 20px;
    }

    /* ============================================================
       FIXED BACK BUTTON
       ============================================================ */
    .fixed-back-btn {
      position: fixed; top: 16px; left: 16px;
      z-index: 1000;
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 10px 22px;
      border-radius: 60px; font-size: 14px;
      font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      transition: 0.2s; font-family: inherit;
    }
    .fixed-back-btn:hover {
      background: #e50914; border-color: #e50914;
      transform: scale(1.05);
    }

    /* ============================================================
       LOADING
       ============================================================ */
    .details-loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; color: #e50914; font-size: 42px;
      z-index: 500;
    }
    .details-loading p { color: #888; font-size: 14px; }

    /* ============================================================
       HERO
       ============================================================ */
    .details-hero {
      position: relative;
      min-height: 85vh;
      display: flex; align-items: flex-end;
      padding: 0 60px 80px;
      overflow: hidden;
    }
    .details-hero-bg {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center 20%;
      transform: scale(1.05);
      transition: transform 8s ease;
    }
    .details-hero:hover .details-hero-bg { transform: scale(1); }
    .details-hero-overlay {
      position: absolute; inset: 0;
      background:
        linear-gradient(0deg, #0b0b0b 0%, rgba(11,11,11,0.75) 30%, transparent 70%),
        linear-gradient(90deg, rgba(11,11,11,0.9) 0%, transparent 60%);
      pointer-events: none;
    }
    .details-hero-content {
      position: relative; z-index: 2;
      max-width: 720px;
      animation: heroFadeIn 0.6s ease;
    }
    @keyframes heroFadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .details-hero-content h1 {
      font-size: 56px; font-weight: 900;
      color: #fff; margin-bottom: 18px;
      line-height: 1.05; letter-spacing: -1px;
      text-shadow: 0 4px 30px rgba(0,0,0,0.9);
    }
    .details-meta {
      display: flex; align-items: center;
      gap: 12px; margin-bottom: 16px;
      flex-wrap: wrap; font-size: 15px;
    }
    .details-rating {
      color: #f5c518; font-weight: 700; font-size: 20px;
    }
    .details-year, .details-runtime { color: #ccc; }
    .details-sep { color: #555; }
    .details-type {
      background: #e50914; color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* ============================================================
       SERIES STATUS
       ============================================================ */
    .series-status-row {
      display: flex; align-items: center;
      gap: 12px; margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .series-status-badge {
      display: inline-flex; align-items: center;
      gap: 6px; padding: 6px 14px;
      border-radius: 60px; font-size: 12px;
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .series-status-badge i { font-size: 8px; }
    .series-status-badge.status-completed {
      background: rgba(34,197,94,0.18);
      border: 1px solid rgba(34,197,94,0.5);
      color: #4ade80;
    }
    .series-status-badge.status-ongoing {
      background: rgba(59,130,246,0.18);
      border: 1px solid rgba(59,130,246,0.5);
      color: #60a5fa;
      animation: pulseOngoing 2s infinite;
    }
    .series-status-badge.status-canceled {
      background: rgba(239,68,68,0.18);
      border: 1px solid rgba(239,68,68,0.5);
      color: #f87171;
    }
    .series-status-badge.status-planned {
      background: rgba(234,179,8,0.18);
      border: 1px solid rgba(234,179,8,0.5);
      color: #facc15;
    }
    @keyframes pulseOngoing {
      0%, 100% { box-shadow: 0 4px 14px rgba(0,0,0,0.5), 0 0 0 0 rgba(59,130,246,0.5); }
      50% { box-shadow: 0 4px 14px rgba(0,0,0,0.5), 0 0 0 8px rgba(59,130,246,0); }
    }
    .series-status-detail {
      color: #bbb; font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .series-status-detail i { color: #e50914; font-size: 12px; }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .details-buttons {
      display: flex; gap: 12px;
      flex-wrap: wrap; margin-bottom: 22px;
    }
    .btn-play-now {
      padding: 14px 36px; border: none;
      border-radius: 8px; background: #fff;
      color: #0b0b0b; font-size: 16px;
      font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      transition: 0.25s;
      box-shadow: 0 4px 20px rgba(255,255,255,0.15);
    }
    .btn-play-now:hover {
      background: #e50914; color: #fff;
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(229,9,20,0.4);
    }
    .btn-trailer {
      padding: 14px 28px;
      border: 1px solid rgba(229,9,20,0.5);
      border-radius: 8px;
      background: rgba(229,9,20,0.15);
      color: #ff6b6b; font-size: 16px;
      font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: 0.2s;
    }
    .btn-trailer:hover {
      background: #e50914; color: #fff;
      border-color: #e50914; transform: scale(1.02);
    }
    .btn-add-list {
      padding: 14px 28px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: #fff; font-size: 16px;
      font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: 0.2s;
      backdrop-filter: blur(10px);
    }
    .btn-add-list:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.4);
    }
    .details-description {
      color: #ddd; font-size: 16px;
      line-height: 1.7; max-width: 700px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }

    /* ============================================================
       BODY
       ============================================================ */
    .details-body {
      padding: 0 60px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 22px; font-weight: 700;
      color: #fff; margin-bottom: 18px;
      display: flex; align-items: center; gap: 10px;
      flex-wrap: wrap;
    }
    .section-title::before {
      content: ''; width: 4px; height: 22px;
      background: #e50914; border-radius: 2px;
    }
    .episodes-count-badge {
      display: inline-flex; align-items: center; gap: 5px;
      margin-left: 8px; padding: 4px 12px;
      background: rgba(229,9,20,0.15);
      border: 1px solid rgba(229,9,20,0.35);
      color: #ff6b6b; font-size: 12px; font-weight: 700;
      border-radius: 60px; letter-spacing: 0.3px;
      text-transform: none;
    }

    /* ============================================================
       EPISODES
       ============================================================ */
    .episodes-section {
      margin-top: 20px; padding-top: 30px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .season-selector {
      display: flex; gap: 8px;
      overflow-x: auto; padding: 4px 0 16px;
      scrollbar-width: thin; scrollbar-color: #333 transparent;
    }
    .season-selector::-webkit-scrollbar { height: 4px; }
    .season-selector::-webkit-scrollbar-thumb {
      background: #333; border-radius: 4px;
    }
    .season-btn {
      flex-shrink: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #ccc; padding: 8px 18px;
      border-radius: 60px; font-size: 13px;
      font-weight: 600; cursor: pointer;
      transition: 0.2s; white-space: nowrap;
    }
    .season-btn:hover {
      background: rgba(255,255,255,0.12); color: #fff;
    }
    .season-btn.active {
      background: #e50914; border-color: #e50914; color: #fff;
    }
    .episodes-list {
      display: flex; flex-direction: column; gap: 10px;
    }
    .episode-item {
      display: flex; gap: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; padding: 12px;
      cursor: pointer; transition: 0.25s;
      align-items: center; position: relative;
    }
    .episode-item:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(229,9,20,0.4);
      transform: translateX(4px);
    }
    .episode-thumb {
      flex-shrink: 0; width: 150px;
      aspect-ratio: 16 / 9; border-radius: 8px;
      object-fit: cover; background: #1a1a1a;
    }
    .episode-info { flex: 1; min-width: 0; }
    .episode-number {
      font-size: 11px; font-weight: 700;
      color: #e50914; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .episode-name {
      font-size: 15px; font-weight: 600;
      color: #fff; margin-bottom: 4px;
    }
    .episode-overview {
      font-size: 12px; color: #888; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .episode-play-icon {
      flex-shrink: 0; width: 38px; height: 38px;
      border-radius: 50%; background: #e50914;
      color: #fff; display: flex;
      align-items: center; justify-content: center;
      font-size: 13px; transition: 0.2s;
    }
    .episode-item:hover .episode-play-icon {
      transform: scale(1.15);
      box-shadow: 0 0 20px rgba(229,9,20,0.5);
    }
    .episode-item.watched { border-color: rgba(34,197,94,0.3); }
    .episode-item.watched::after {
      content: '✓'; position: absolute;
      top: 8px; right: 8px;
      background: #22c55e; color: #fff;
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold;
    }
    .episode-item.upcoming { opacity: 0.55; cursor: not-allowed; }
    .episode-item.upcoming .episode-play-icon { background: #444; }
    .episode-item.upcoming:hover {
      transform: none;
      border-color: rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.04);
    }
    .upcoming-badge {
      position: absolute; top: 8px; right: 8px;
      background: rgba(234,179,8,0.2);
      border: 1px solid rgba(234,179,8,0.5);
      color: #facc15; font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .episodes-loading {
      text-align: center; color: #666;
      padding: 20px; font-size: 14px;
    }

    /* ============================================================
       CAST (NON-CLICKABLE)
       ============================================================ */
    .cast-section {
      margin-top: 32px; padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .cast-scroll {
      display: flex; gap: 14px;
      overflow-x: auto; padding: 4px 0 12px;
      scrollbar-width: thin; scrollbar-color: #333 transparent;
    }
    .cast-scroll::-webkit-scrollbar { height: 4px; }
    .cast-scroll::-webkit-scrollbar-thumb {
      background: #333; border-radius: 4px;
    }
    .cast-card {
      flex-shrink: 0; width: 110px;
      text-align: center;
      cursor: default;
      transition: transform 0.25s;
    }
    .cast-card:hover { transform: translateY(-4px); }
    .cast-card img {
      width: 110px; height: 110px;
      border-radius: 50%; object-fit: cover;
      background: #1a1a1a;
      border: 2px solid rgba(255,255,255,0.1);
      transition: border-color 0.25s;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .cast-card:hover img {
      border-color: rgba(229,9,20,0.6);
      box-shadow: 0 0 20px rgba(229,9,20,0.3);
    }
    .cast-card .cast-name {
      font-size: 12px; font-weight: 600;
      color: #fff; margin-top: 8px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
      pointer-events: none; user-select: none;
    }
    .cast-card .cast-role {
      font-size: 11px; color: #888; margin-top: 2px;
      pointer-events: none; user-select: none;
    }

    /* ============================================================
       SIMILAR
       ============================================================ */
    .similar-section {
      margin-top: 28px; padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .similar-scroll {
      display: flex; gap: 12px;
      overflow-x: auto; padding: 4px 0 12px;
      scrollbar-width: thin; scrollbar-color: #333 transparent;
    }
    .similar-scroll::-webkit-scrollbar { height: 4px; }
    .similar-scroll::-webkit-scrollbar-thumb {
      background: #333; border-radius: 4px;
    }
    .similar-scroll img {
      width: 140px; flex-shrink: 0;
      aspect-ratio: 2 / 3; object-fit: cover;
      border-radius: 8px; cursor: pointer;
      background: #1a1a1a; transition: 0.3s;
    }
    .similar-scroll img:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(229,9,20,0.3);
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
      .details-hero { padding: 0 20px 60px; min-height: 70vh; }
      .details-hero-content h1 { font-size: 34px; }
      .details-description { font-size: 14px; }
      .details-body { padding: 0 16px 60px; }
      .btn-play-now, .btn-trailer, .btn-add-list {
        padding: 12px 22px; font-size: 14px;
      }
      .episode-thumb { width: 110px; }
      .episode-name { font-size: 13px; }
      .cast-card, .cast-card img { width: 85px; }
      .cast-card img { height: 85px; }
      .similar-scroll img { width: 115px; }
      .section-title { font-size: 18px; }
      .fixed-back-btn { top: 10px; left: 10px; padding: 8px 16px; font-size: 13px; }
      .series-status-detail { font-size: 12px; }
    }
    @media (max-width: 480px) {
      .details-hero-content h1 { font-size: 26px; }
      .episode-thumb { width: 90px; }
      .episode-overview { display: none; }
      .cast-card, .cast-card img { width: 75px; }
      .cast-card img { height: 75px; }
      .similar-scroll img { width: 100px; }
      .series-status-badge { font-size: 10px; padding: 5px 10px; }
      .series-status-detail { font-size: 11px; }
      .episodes-count-badge { font-size: 11px; padding: 3px 10px; }
    }
  </style>
</head>

<body>

  <!-- ===== LOGIN SCREEN ===== -->
  <div class="login-screen" id="login-screen">
    <div class="login-bg"></div>
    <div class="login-box">
      <a href="index.html" class="login-logo">Mobi<span>Flix</span></a>
      <h2>Sign In</h2>
      <form id="login-form">
        <div class="login-field">
          <i class="fa fa-user"></i>
          <input type="text" id="login-username" placeholder="Username" autocomplete="username" />
        </div>
        <div class="login-field">
          <i class="fa fa-lock"></i>
          <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
        </div>
        <div class="login-error" id="login-error" style="display:none;"></div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
      <p class="login-note">Enter your username and password to continue.</p>
    </div>
  </div>

  <!-- ===== BACK BUTTON ===== -->
  <button class="fixed-back-btn" onclick="goBack()">
    <i class="fa fa-arrow-left"></i> Back
  </button>

  <div id="app-content">

    <!-- ===== LOADING ===== -->
    <div class="details-loading" id="details-loading">
      <i class="fa fa-spinner fa-spin"></i>
      <p>Loading details...</p>
    </div>

    <!-- ===== DETAILS WRAPPER ===== -->
    <div class="details-page" id="details-page" style="display:none;">

      <!-- HERO / BACKDROP -->
      <div class="details-hero">
        <div class="details-hero-bg" id="details-hero-bg"></div>
        <div class="details-hero-overlay"></div>

        <div class="details-hero-content">
          <h1 id="details-title">Loading...</h1>

          <div class="details-meta">
            <span class="details-rating" id="details-rating">—</span>
            <span class="details-sep">|</span>
            <span class="details-year" id="details-year">—</span>
            <span class="details-sep">|</span>
            <span class="details-runtime" id="details-runtime">—</span>
            <span class="details-type" id="details-type"></span>
          </div>

          <!-- SERIES STATUS BADGE -->
          <div class="series-status-row" id="series-status-row" style="display:none;">
            <span class="series-status-badge" id="series-status-badge"></span>
            <span class="series-status-detail" id="series-status-detail"></span>
          </div>

          <div class="details-buttons">
            <button class="btn-play-now" onclick="playNow()">
              <i class="fa fa-play"></i> Play Now
            </button>
            <button class="btn-trailer" id="btn-trailer" onclick="playTrailer()" style="display:none;">
              <i class="fa fa-film"></i> Trailer
            </button>
            <button class="btn-add-list" onclick="toggleAddToList()">
              <i class="fa fa-bookmark" id="bookmark-icon"></i>
              <span id="bookmark-text">Add to List</span>
            </button>
          </div>

          <p class="details-description" id="details-description"></p>
        </div>
      </div>

      <!-- BODY -->
      <div class="details-body">

        <!-- EPISODES -->
        <div class="episodes-section" id="episodes-section" style="display:none;">
          <h3 class="section-title">
            📺 Episodes
            <span class="episodes-count-badge" id="episodes-count-badge"></span>
          </h3>
          <div class="season-selector" id="season-selector"></div>
          <div class="episodes-list" id="episodes-list"></div>
        </div>

        <!-- CAST -->
        <div class="cast-section" id="cast-section">
          <h3 class="section-title">🎭 Cast</h3>
          <div class="cast-scroll" id="cast-list"></div>
        </div>

        <!-- SIMILAR -->
        <div class="similar-section" id="similar-section">
          <h3 class="section-title">✨ You May Also Like</h3>
          <div class="similar-scroll" id="similar-list"></div>
        </div>

      </div>
    </div>

  </div>

  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
    // ============================================
    //   MOBIFLIX — DETAILS PAGE
    // ============================================
    const API_KEY = 'e0a7266a5d0e95c36475f349d8bc0a5a';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_URL = 'https://image.tmdb.org/t/p/original';
    const IMG_W500 = 'https://image.tmdb.org/t/p/w500';
    const IMG_PROFILE = 'https://image.tmdb.org/t/p/w185';

    const HISTORY_KEY = 'mobiflix_watch_history';
    const CONTINUE_KEY = 'mobiflix_continue_watching';
    const EPISODE_PROGRESS_KEY = 'mobiflix_episode_progress';
    const WATCHLIST_KEY = 'mobiflix_watchlist';
    const THEME_KEY = 'mobiflix_theme';
    const MAX_HISTORY = 30;
    const MAX_CONTINUE = 10;

    const KOREAN_COUNTRY = 'KR';
    const KOREAN_LANG = 'ko';
    const EXCLUDED_GENRES = '10764,10767,10763,10766';

    let currentItem = null;
    let currentTvId = null;
    let currentTrailerKey = null;
    let seriesInfo = null;

    // ============================================
    //   URL PARAMS
    // ============================================
    function getParams() {
      const p = new URLSearchParams(window.location.search);
      return {
        id: p.get('id'),
        type: p.get('type') || 'movie'
      };
    }

    // ============================================
    //   THEME
    // ============================================
    function loadTheme() {
      const theme = localStorage.getItem(THEME_KEY) || 'default';
      document.body.classList.remove('theme-blue', 'theme-purple', 'theme-green', 'theme-light');
      if (theme === 'light') document.body.classList.add('theme-light');
      else if (theme === 'dark-blue') document.body.classList.add('theme-blue');
      else if (theme === 'dark-purple') document.body.classList.add('theme-purple');
      else if (theme === 'dark-green') document.body.classList.add('theme-green');
    }

    // ============================================
    //   FILTERS
    // ============================================
    function filterReleased(results) {
      const today = new Date().toISOString().split('T')[0];
      return (results || []).filter(function(item) {
        const date = item.release_date || item.first_air_date;
        if (!date) return true;
        return date <= today;
      });
    }

    function filterOutNonDrama(results) {
      return (results || []).filter(function(item) {
        const genres = item.genre_ids || [];
        const hasExcluded = genres.some(function(g) {
          return EXCLUDED_GENRES.split(',').map(Number).includes(g);
        });
        return !hasExcluded;
      });
    }

    // ============================================
    //   FETCH FUNCTIONS
    // ============================================
    async function fetchDetails(id, type) {
      const t = type === 'movie' ? 'movie' : 'tv';
      const res = await fetch(`${BASE_URL}/${t}/${id}?api_key=${API_KEY}`);
      const data = await res.json();
      data.media_type = t;
      return data;
    }

    async function fetchCredits(mediaType, id) {
      try {
        const t = mediaType === 'tv' ? 'tv' : 'movie';
        const res = await fetch(`${BASE_URL}/${t}/${id}/credits?api_key=${API_KEY}`);
        const data = await res.json();
        return (data.cast || []).slice(0, 15);
      } catch (err) { return []; }
    }

    async function fetchSimilar(mediaType, id) {
      try {
        const t = mediaType === 'tv' ? 'tv' : 'movie';
        let res = await fetch(`${BASE_URL}/${t}/${id}/recommendations?api_key=${API_KEY}`);
        let data = await res.json();
        if (!data.results || data.results.length === 0) {
          res = await fetch(`${BASE_URL}/${t}/${id}/similar?api_key=${API_KEY}`);
          data = await res.json();
        }
        let results = (data.results || []).filter(function(item) {
          return (item.origin_country || []).includes(KOREAN_COUNTRY) ||
                 item.original_language === KOREAN_LANG;
        });
        results = filterReleased(results);
        results = filterOutNonDrama(results);
        return results.filter(function(x) { return x.poster_path; }).slice(0, 15);
      } catch (err) { return []; }
    }

    async function fetchTrailer(mediaType, id) {
      try {
        const t = mediaType === 'tv' ? 'tv' : 'movie';
        const res = await fetch(`${BASE_URL}/${t}/${id}/videos?api_key=${API_KEY}`);
        const data = await res.json();
        const videos = data.results || [];
        const trailer = videos.find(function(v) {
          return v.type === 'Trailer' && v.site === 'YouTube';
        }) || videos.find(function(v) { return v.site === 'YouTube'; });
        return trailer ? trailer.key : null;
      } catch (err) { return null; }
    }

    async function fetchTvSeasons(tvId) {
      try {
        const res = await fetch(`${BASE_URL}/tv/${tvId}?api_key=${API_KEY}`);
        const data = await res.json();
        return data.seasons || [];
      } catch (err) { return []; }
    }

    async function fetchSeasonEpisodes(tvId, seasonNumber) {
      try {
        const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${seasonNumber}?api_key=${API_KEY}`);
        const data = await res.json();
        return data.episodes || [];
      } catch (err) { return []; }
    }

    // ============================================
    //   STORAGE
    // ============================================
    function getWatchHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
      catch (e) { return []; }
    }
    function saveWatchHistory(list) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
    }
    function addToHistory(item) {
      if (!item || !item.id) return;
      const list = getWatchHistory();
      const filtered = list.filter(function(x) { return x.id !== item.id; });
      filtered.unshift({
        id: item.id,
        title: item.title || item.name,
        poster_path: item.poster_path,
        media_type: item.media_type || (item.title ? 'movie' : 'tv'),
        vote_average: item.vote_average,
        release_date: item.release_date || item.first_air_date,
        watchedAt: Date.now()
      });
      if (filtered.length > MAX_HISTORY) filtered.length = MAX_HISTORY;
      saveWatchHistory(filtered);
    }

    function getContinueWatching() {
      try { return JSON.parse(localStorage.getItem(CONTINUE_KEY)) || []; }
      catch (e) { return []; }
    }
    function saveContinueWatching(list) {
      localStorage.setItem(CONTINUE_KEY, JSON.stringify(list));
    }
    function addToContinueWatching(item) {
      if (!item || !item.id) return;
      const list = getContinueWatching();
      const filtered = list.filter(function(x) { return x.id !== item.id; });
      filtered.unshift({
        id: item.id,
        title: item.title || item.name,
        poster_path: item.poster_path,
        backdrop_path: item.backdrop_path,
        media_type: item.media_type || (item.title ? 'movie' : 'tv'),
        vote_average: item.vote_average,
        release_date: item.release_date || item.first_air_date,
        progress: Math.floor(Math.random() * 70) + 15,
        watchedAt: Date.now()
      });
      if (filtered.length > MAX_CONTINUE) filtered.length = MAX_CONTINUE;
      saveContinueWatching(filtered);
    }

    function getWatchlist() {
      try { return JSON.parse(localStorage.getItem(WATCHLIST_KEY)) || []; }
      catch (e) { return []; }
    }
    function saveWatchlist(list) {
      localStorage.setItem(WATCHLIST_KEY, JSON.stringify(list));
    }

    function getEpisodeProgress() {
      try { return JSON.parse(localStorage.getItem(EPISODE_PROGRESS_KEY)) || {}; }
      catch (e) { return {}; }
    }
    function markEpisodeWatched(tvId, seasonNumber, episodeNumber) {
      const progress = getEpisodeProgress();
      progress[`${tvId}_s${seasonNumber}e${episodeNumber}`] = Date.now();
      localStorage.setItem(EPISODE_PROGRESS_KEY, JSON.stringify(progress));
    }
    function isEpisodeWatched(tvId, seasonNumber, episodeNumber) {
      const progress = getEpisodeProgress();
      return !!progress[`${tvId}_s${seasonNumber}e${episodeNumber}`];
    }

    // ============================================
    //   SERIES STATUS
    // ============================================
    function getSeriesStatusLabel(status) {
      switch (status) {
        case 'Returning Series': return { label: 'Ongoing', class: 'status-ongoing', icon: 'fa-circle' };
        case 'Ended':            return { label: 'Completed', class: 'status-completed', icon: 'fa-check-circle' };
        case 'Canceled':
        case 'Cancelled':        return { label: 'Cancelled', class: 'status-canceled', icon: 'fa-times-circle' };
        case 'In Production':    return { label: 'In Production', class: 'status-planned', icon: 'fa-hammer' };
        case 'Planned':          return { label: 'Planned', class: 'status-planned', icon: 'fa-calendar' };
        case 'Pilot':            return { label: 'Pilot', class: 'status-planned', icon: 'fa-flask' };
        default:                 return { label: status || 'Unknown', class: 'status-ongoing', icon: 'fa-circle' };
      }
    }

    async function computeSeriesInfo(item) {
      const info = {
        status: item.status || 'Unknown',
        statusLabel: '',
        statusClass: '',
        statusIcon: '',
        totalSeasons: item.number_of_seasons || 0,
        totalEpisodes: item.number_of_episodes || 0,
        airedEpisodes: 0,
        remainingEpisodes: 0,
        nextAirDate: item.next_episode_to_air ? item.next_episode_to_air.air_date : null,
        isCompleted: false,
        isOngoing: false
      };

      const statusInfo = getSeriesStatusLabel(info.status);
      info.statusLabel = statusInfo.label;
      info.statusClass = statusInfo.class;
      info.statusIcon = statusInfo.icon;
      info.isCompleted = (info.status === 'Ended' || info.status === 'Canceled' || info.status === 'Cancelled');
      info.isOngoing = (info.status === 'Returning Series' || info.status === 'In Production' || info.status === 'Planned');

      try {
        const seasons = item.seasons || [];
        const validSeasons = seasons.filter(function(s) {
          return s.season_number > 0 && s.air_date;
        });

        const today = new Date().toISOString().split('T')[0];
        let aired = 0;

        const promises = validSeasons.map(function(s) {
          return fetchSeasonEpisodes(item.id, s.season_number);
        });
        const allSeasonEpisodes = await Promise.all(promises);

        allSeasonEpisodes.forEach(function(episodes) {
          (episodes || []).forEach(function(ep) {
            if (ep.air_date && ep.air_date <= today) aired++;
          });
        });

        info.airedEpisodes = aired;
        info.remainingEpisodes = Math.max(0, info.totalEpisodes - aired);

        if (!info.totalEpisodes) {
          info.totalEpisodes = aired + info.remainingEpisodes;
        }
      } catch (err) {
        info.airedEpisodes = item.number_of_episodes || 0;
        info.remainingEpisodes = 0;
      }

      return info;
    }

    // ============================================
    //   RENDER DETAILS
    // ============================================
    async function renderDetails(item) {
      currentItem = item;

      const bg = document.getElementById('details-hero-bg');
      bg.style.backgroundImage = `url(${IMG_URL}${item.backdrop_path || item.poster_path})`;

      document.getElementById('details-title').textContent = item.title || item.name;
      document.getElementById('details-rating').textContent = (item.vote_average || 0).toFixed(1);
      document.getElementById('details-year').textContent =
        (item.release_date || item.first_air_date || '').slice(0, 4) || '—';

      const runtimeEl = document.getElementById('details-runtime');
      if (item.media_type === 'movie' && item.runtime) {
        const h = Math.floor(item.runtime / 60);
        const m = item.runtime % 60;
        runtimeEl.textContent = h + 'H ' + m + 'M';
      } else if (item.media_type === 'tv' && item.number_of_seasons) {
        runtimeEl.textContent = item.number_of_seasons + ' Season' + (item.number_of_seasons > 1 ? 's' : '');
      } else {
        runtimeEl.textContent = '—';
      }

      document.getElementById('details-type').textContent =
        item.media_type === 'movie' ? 'Movie' : 'Korean Series';

      document.getElementById('details-description').textContent =
        item.overview || 'No description available.';

      document.getElementById('details-loading').style.display = 'none';
      document.getElementById('details-page').style.display = 'block';

      addToHistory(item);
      addToContinueWatching(item);
      updateBookmarkUI(item);

      if (item.media_type === 'tv') {
        seriesInfo = await computeSeriesInfo(item);
        renderSeriesStatus(seriesInfo);
        loadEpisodesSection(item);
      } else {
        document.getElementById('series-status-row').style.display = 'none';
        document.getElementById('episodes-section').style.display = 'none';
      }

      loadCastAndSimilarAndTrailer(item);
      document.title = (item.title || item.name) + ' — MobiFlix';
    }

    function renderSeriesStatus(info) {
      const row = document.getElementById('series-status-row');
      const badge = document.getElementById('series-status-badge');
      const detail = document.getElementById('series-status-detail');

      if (!info) { row.style.display = 'none'; return; }
      row.style.display = 'flex';

      badge.className = 'series-status-badge ' + info.statusClass;
      badge.innerHTML = '<i class="fa ' + info.statusIcon + '"></i> ' + info.statusLabel;

      let detailText = '';
      if (info.statusLabel === 'Completed') {
        detailText = info.totalSeasons + ' Season' + (info.totalSeasons > 1 ? 's' : '') +
                     ' · ' + info.totalEpisodes + ' Episodes · Complete';
      } else if (info.statusLabel === 'Ongoing' || info.statusLabel === 'In Production') {
        if (info.remainingEpisodes > 0) {
          detailText = info.airedEpisodes + ' / ' + info.totalEpisodes + ' Episodes Aired · ' +
                       info.remainingEpisodes + ' Remaining';
        } else if (info.nextAirDate) {
          detailText = info.airedEpisodes + ' Episodes Aired · Next: ' + formatDate(info.nextAirDate);
        } else {
          detailText = info.airedEpisodes + ' Episodes Aired · Ongoing';
        }
      } else if (info.statusLabel === 'Cancelled') {
        detailText = info.totalSeasons + ' Season' + (info.totalSeasons > 1 ? 's' : '') +
                     ' · ' + info.airedEpisodes + ' Episodes Aired · Cancelled';
      } else {
        detailText = info.totalSeasons + ' Season' + (info.totalSeasons > 1 ? 's' : '') +
                     ' · ' + info.totalEpisodes + ' Episodes';
      }

      detail.innerHTML = '<i class="fa fa-info-circle"></i> ' + detailText;

      const countBadge = document.getElementById('episodes-count-badge');
      if (countBadge) {
        if (info.statusLabel === 'Ongoing' && info.remainingEpisodes > 0) {
          countBadge.textContent = info.airedEpisodes + ' / ' + info.totalEpisodes + ' Episodes';
        } else {
          countBadge.textContent = info.totalEpisodes + ' Episodes';
        }
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      try {
        const d = new Date(dateStr);
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
      } catch (e) { return dateStr; }
    }

    function updateBookmarkUI(item) {
      const list = getWatchlist();
      const exists = list.find(function(x) { return x.id === item.id; });
      const icon = document.getElementById('bookmark-icon');
      const text = document.getElementById('bookmark-text');
      if (!icon || !text) return;
      if (exists) {
        icon.className = 'fa fa-bookmark';
        text.textContent = 'Added to List';
      } else {
        icon.className = 'fa fa-bookmark-o';
        text.textContent = 'Add to List';
      }
    }

    async function loadCastAndSimilarAndTrailer(item) {
      const castList = document.getElementById('cast-list');
      const similarList = document.getElementById('similar-list');
      castList.innerHTML = '<div style="color:#666;padding:10px 0;">Loading cast...</div>';
      similarList.innerHTML = '<div style="color:#666;padding:10px 0;flex-shrink:0;">Loading recommendations...</div>';

      const [cast, similar, trailerKey] = await Promise.all([
        fetchCredits(item.media_type, item.id),
        fetchSimilar(item.media_type, item.id),
        fetchTrailer(item.media_type, item.id)
      ]);

      renderCast(cast);
      renderSimilar(similar, item.media_type);

      if (trailerKey) {
        currentTrailerKey = trailerKey;
        document.getElementById('btn-trailer').style.display = 'flex';
      }
    }

    // CAST — NON-CLICKABLE
    function renderCast(cast) {
      const container = document.getElementById('cast-list');
      container.innerHTML = '';
      if (!cast || cast.length === 0) {
        container.innerHTML = '<div style="color:#666;padding:10px 0;">No cast information.</div>';
        return;
      }
      cast.forEach(function(person) {
        const card = document.createElement('div');
        card.className = 'cast-card';
        // Hindi clickable — walang onclick

        const img = document.createElement('img');
        img.alt = person.name;
        img.loading = 'lazy';
        img.draggable = false;
        if (person.profile_path) img.src = `${IMG_PROFILE}${person.profile_path}`;
        else img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="%23444"><circle cx="50" cy="40" r="20"/><ellipse cx="50" cy="90" rx="35" ry="30"/></svg>';

        const name = document.createElement('div');
        name.className = 'cast-name';
        name.textContent = person.name;

        const role = document.createElement('div');
        role.className = 'cast-role';
        role.textContent = person.character || '';

        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(role);
        container.appendChild(card);
      });
    }

    function renderSimilar(similar, mediaType) {
      const container = document.getElementById('similar-list');
      container.innerHTML = '';
      if (!similar || similar.length === 0) {
        container.innerHTML = '<div style="color:#666;padding:10px 0;flex-shrink:0;">No recommendations.</div>';
        return;
      }
      similar.forEach(function(item) {
        item.media_type = mediaType;
        const img = document.createElement('img');
        img.src = `${IMG_W500}${item.poster_path}`;
        img.alt = item.title || item.name;
        img.loading = 'lazy';
        img.onclick = function() {
          window.location.href = `details.html?id=${item.id}&type=${mediaType}`;
        };
        container.appendChild(img);
      });
    }

    // ============================================
    //   EPISODES
    // ============================================
    async function loadEpisodesSection(item) {
      const section = document.getElementById('episodes-section');
      const seasonSelector = document.getElementById('season-selector');
      const episodesList = document.getElementById('episodes-list');
      section.style.display = 'block';
      seasonSelector.innerHTML = '';
      episodesList.innerHTML = '<div class="episodes-loading"><i class="fa fa-spinner fa-spin"></i> Loading episodes...</div>';
      currentTvId = item.id;

      const seasons = await fetchTvSeasons(item.id);
      const validSeasons = seasons.filter(function(s) { return s.season_number > 0; });

      if (validSeasons.length === 0) {
        episodesList.innerHTML = '<div class="episodes-loading">No episodes available.</div>';
        return;
      }

      validSeasons.forEach(function(season, index) {
        const btn = document.createElement('button');
        btn.className = 'season-btn' + (index === 0 ? ' active' : '');
        btn.textContent = 'Season ' + season.season_number;
        btn.onclick = function() {
          document.querySelectorAll('.season-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          loadSeasonEpisodes(item.id, season.season_number);
        };
        seasonSelector.appendChild(btn);
      });

      loadSeasonEpisodes(item.id, validSeasons[0].season_number);
    }

    async function loadSeasonEpisodes(tvId, seasonNumber) {
      const episodesList = document.getElementById('episodes-list');
      episodesList.innerHTML = '<div class="episodes-loading"><i class="fa fa-spinner fa-spin"></i> Loading episodes...</div>';

      let episodes = await fetchSeasonEpisodes(tvId, seasonNumber);
      episodes = (episodes || []).sort(function(a, b) {
        return (a.episode_number || 0) - (b.episode_number || 0);
      });

      if (!episodes || episodes.length === 0) {
        episodesList.innerHTML = '<div class="episodes-loading">No episodes available.</div>';
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      episodesList.innerHTML = '';

      episodes.forEach(function(ep) {
        const hasAired = ep.air_date && ep.air_date <= today;
        const episodeItem = document.createElement('div');
        episodeItem.className = 'episode-item';

        if (hasAired && isEpisodeWatched(tvId, seasonNumber, ep.episode_number)) {
          episodeItem.classList.add('watched');
        }
        if (!hasAired) {
          episodeItem.classList.add('upcoming');
        }

        episodeItem.onclick = function() {
          if (!hasAired) return;
          playEpisode(tvId, seasonNumber, ep.episode_number);
        };

        const thumb = document.createElement('img');
        thumb.className = 'episode-thumb';
        thumb.loading = 'lazy';
        if (ep.still_path) thumb.src = `${IMG_W500}${ep.still_path}`;
        else thumb.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="%23222"><rect width="320" height="180"/></svg>';

        const info = document.createElement('div');
        info.className = 'episode-info';

        const num = document.createElement('div');
        num.className = 'episode-number';
        num.textContent = 'S' + seasonNumber + ' • E' + ep.episode_number;

        const name = document.createElement('div');
        name.className = 'episode-name';
        name.textContent = ep.name || ('Episode ' + ep.episode_number);

        const overview = document.createElement('div');
        overview.className = 'episode-overview';
        if (hasAired) {
          overview.textContent = ep.overview || 'No description available.';
        } else {
          overview.textContent = 'Airs on ' + formatDate(ep.air_date);
        }

        info.appendChild(num);
        info.appendChild(name);
        info.appendChild(overview);

        const playIcon = document.createElement('div');
        playIcon.className = 'episode-play-icon';
        playIcon.innerHTML = hasAired ? '<i class="fa fa-play"></i>' : '<i class="fa fa-clock"></i>';

        episodeItem.appendChild(thumb);
        episodeItem.appendChild(info);
        episodeItem.appendChild(playIcon);

        if (!hasAired) {
          const upcomingBadge = document.createElement('div');
          upcomingBadge.className = 'upcoming-badge';
          upcomingBadge.textContent = 'Upcoming';
          episodeItem.appendChild(upcomingBadge);
        }

        episodesList.appendChild(episodeItem);
      });
    }

    // ============================================
    //   PLAY ACTIONS
    // ============================================
    function playNow() {
      if (!currentItem) return;
      const isMovie = currentItem.media_type === 'movie';
      const title = currentItem.title || currentItem.name || 'MobiFlix';
      let url;
      if (isMovie) {
        url = `player.html?type=movie&id=${currentItem.id}&title=${encodeURIComponent(title)}`;
      } else {
        const firstSeason = (currentItem.seasons || []).filter(function(s) { return s.season_number > 0; })[0];
        const seasonNum = firstSeason ? firstSeason.season_number : 1;
        url = `player.html?type=tv&id=${currentItem.id}&season=${seasonNum}&episode=1&title=${encodeURIComponent(title)}`;
      }
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }
      window.location.href = url;
    }

    function playEpisode(tvId, seasonNumber, episodeNumber) {
      markEpisodeWatched(tvId, seasonNumber, episodeNumber);
      const title = currentItem ? (currentItem.title || currentItem.name) : 'Korean Series';
      const url = `player.html?type=tv&id=${tvId}&season=${seasonNumber}&episode=${episodeNumber}&title=${encodeURIComponent(title)}`;
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }
      window.location.href = url;
    }

    function playTrailer() {
      if (!currentTrailerKey) return;
      window.open(`https://www.youtube.com/watch?v=${currentTrailerKey}`, '_blank');
    }

    // ============================================
    //   WATCHLIST
    // ============================================
    function toggleAddToList() {
      if (!currentItem) return;
      const list = getWatchlist();
      const index = list.findIndex(function(x) { return x.id === currentItem.id; });
      if (index >= 0) {
        list.splice(index, 1);
      } else {
        list.push({
          id: currentItem.id,
          title: currentItem.title || currentItem.name,
          poster_path: currentItem.poster_path,
          media_type: currentItem.media_type,
          vote_average: currentItem.vote_average,
          release_date: currentItem.release_date || currentItem.first_air_date
        });
      }
      saveWatchlist(list);
      updateBookmarkUI(currentItem);
    }

    // ============================================
    //   BACK BUTTON
    // ============================================
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    // ============================================
    //   INIT
    // ============================================
    async function init() {
      loadTheme();
      const params = getParams();
      if (!params.id) {
        window.location.href = 'index.html';
        return;
      }
      try {
        const item = await fetchDetails(params.id, params.type);
        await renderDetails(item);
      } catch (err) {
        console.error('[Details] Error:', err);
        document.getElementById('details-loading').innerHTML =
          '<p style="color:#e50914;">Failed to load. <a href="index.html" style="color:#fff;">Go back home</a></p>';
      }
    }

    window.addEventListener('popstate', function() { goBack(); });

    init();
  </script>
</body>
</html>
