<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>MobiFlix Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #player-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #e50914;
      font-size: 42px;
      transition: opacity 0.4s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .player-back-btn {
      position: fixed;
      top: 16px; left: 16px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      transition: 0.2s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .player-back-btn:hover {
      background: #e50914;
      border-color: #e50914;
      transform: scale(1.05);
    }
    @media (max-width: 768px) {
      .player-back-btn {
        top: 10px; left: 10px;
        padding: 8px 14px; font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <button class="player-back-btn" onclick="goBackFromPlayer()">
    <i class="fa fa-arrow-left"></i> Back
  </button>

  <div class="loading-overlay" id="loading-overlay">
    <i class="fa fa-spinner fa-spin"></i>
  </div>

  <iframe
    id="player-frame"
    src=""
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    allowfullscreen
    referrerpolicy="no-referrer"
  ></iframe>

  <script>
    function goBackFromPlayer() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const type = params.get('type') || 'movie';
      if (id) {
        window.location.href = `details.html?id=${id}&type=${type}`;
      } else {
        window.location.href = 'index.html';
      }
    }

    (function() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type') || 'movie';
      const id = params.get('id') || '';
      const season = params.get('season') || '';
      const episode = params.get('episode') || '';

      const MOVIE_BASE = 'https://vidstuck.xyz/embed/movie/';
      const TV_BASE = 'https://vidstuck.xyz/embed/tv/';

      let embedURL = '';
      if (type === 'tv') {
        if (season && episode) {
          embedURL = `${TV_BASE}${id}/${season}/${episode}`;
        } else {
          embedURL = `${TV_BASE}${id}`;
        }
      } else {
        embedURL = `${MOVIE_BASE}${id}`;
      }

      const subtitleParams = [
        'autoplay=1', 'autoPlay=1', 'muted=0', 'playsinline=1',
        'subtitle=en', 'subtitle=en_US', 'sub_lang=en', 'sub=en',
        'lang=en', 'cc=1', 'cc_lang=en', 'sub=1', 'caption=en',
        'captions=1', 'default_subtitle=en'
      ];

      const separator = embedURL.includes('?') ? '&' : '?';
      embedURL = embedURL + separator + subtitleParams.join('&');

      const frame = document.getElementById('player-frame');
      frame.src = embedURL;

      function sendSubtitleCommands() {
        try {
          const commands = [
            { type: 'setSubtitle', lang: 'en', enabled: true },
            { type: 'subtitle', enabled: true, lang: 'en' },
            { type: 'enableSubtitle', lang: 'en' },
            { type: 'setSubtitleTrack', lang: 'en' },
            { type: 'cc', enabled: true, lang: 'en' },
            { type: 'captions', enabled: true, lang: 'en' },
            { type: 'play' }, { event: 'play' }, { action: 'play' }
          ];
          commands.forEach(function(cmd) {
            try { frame.contentWindow.postMessage(cmd, '*'); } catch (e) {}
          });
        } catch (e) {}
      }

      frame.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('loading-overlay').classList.add('hidden');
        }, 600);
        sendSubtitleCommands();
        setTimeout(sendSubtitleCommands, 1500);
        setTimeout(sendSubtitleCommands, 3000);
        setTimeout(sendSubtitleCommands, 5000);
      });

      setTimeout(function() {
        document.getElementById('loading-overlay').classList.add('hidden');
      }, 4000);

      window.addEventListener('message', function(event) {
        const data = event.data;
        if (!data) return;
        if (typeof data === 'object') {
          if (data.event === 'ready' || data.type === 'ready') {
            sendSubtitleCommands();
          }
        }
      });

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }

      console.log('[MobiFlix Player] Embed URL:', embedURL);
    })();
  </script>
</body>
</html>
