<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>MobiFlix Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* 外层容器，用于居中缩放后的 iframe */
    #player-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    #player-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      transform-origin: center center;
      transition: transform 0.25s ease;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #e50914;
      font-size: 42px;
      transition: opacity 0.4s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .player-back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 30;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 10px 20px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
    }
    .player-back-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .player-back-btn:hover {
      background: #e50914;
      border-color: #e50914;
    }

    /* 字幕缩放控制按钮 */
    .subtitle-controls {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 30;
      display: flex;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .subtitle-controls.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .subtitle-controls button {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .subtitle-controls button:hover {
      background: #e50914;
      border-color: #e50914;
    }
    .subtitle-controls .size-label {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 0 10px;
      height: 38px;
      border-radius: 60px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      min-width: 44px;
      justify-content: center;
    }

    @media (max-width: 600px) {
      .player-back-btn { padding: 8px 14px; font-size: 12px; }
      .subtitle-controls button { width: 34px; height: 34px; font-size: 12px; }
      .subtitle-controls .size-label { height: 34px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loading-overlay">
    <i class="fa fa-spinner fa-spin"></i>
  </div>

  <button class="player-back-btn" id="player-back-btn" onclick="goBackFromPlayer()">
    <i class="fa fa-arrow-left"></i> Back
  </button>

  <!-- 字幕缩放控制按钮 -->
  <div class="subtitle-controls" id="subtitle-controls">
    <button onclick="changeSubtitleSize(-1)" title="缩小字幕">A−</button>
    <div class="size-label" id="size-label">100%</div>
    <button onclick="changeSubtitleSize(1)" title="放大字幕">A+</button>
  </div>

  <div id="player-wrapper">
    <iframe
      id="player-frame"
      src=""
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
      allowfullscreen
      referrerpolicy="no-referrer"
    ></iframe>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type') || 'movie';
      const id = params.get('id') || '';
      const season = params.get('season') || '';
      const episode = params.get('episode') || '';

      const MOVIE_BASE = 'https://embed.vidstuck.xyz/embed/movie/';
      const TV_BASE = 'https://embed.vidstuck.xyz/embed/tv/';

      let embedURL = '';

      if (type === 'tv') {
        if (season && episode) {
          embedURL = `${TV_BASE}${id}/${season}/${episode}`;
        } else {
          embedURL = `${TV_BASE}${id}`;
        }
      } else {
        embedURL = `${MOVIE_BASE}${id}`;
      }

      // === BRANDING PARAMETERS ===
      const brandingParams = [
        'branding=MobiFlix',
        'loading=1',
        'back=true',
        'autoplay=1',
        'muted=0',
        'playsinline=1',
        'subtitle=en',
        'sub_lang=en',
        'cc=1',
        'cc_lang=en',
        'sub=1',
        'caption=en',
        'captions=1',
        'default_subtitle=en'
      ];

      const separator = embedURL.includes('?') ? '&' : '?';
      embedURL = embedURL + separator + brandingParams.join('&');

      const frame = document.getElementById('player-frame');
      frame.src = embedURL;

      // === 通过缩放 iframe 来调整字幕大小 ===
      const MIN_SCALE = 0.75;
      const MAX_SCALE = 1.15;
      const STEP = 0.05;
      let currentScale = 1.0;

      function applyScale() {
        frame.style.transform = `scale(${currentScale})`;
        document.getElementById('size-label').textContent =
          Math.round(currentScale * 100) + '%';
        try { localStorage.setItem('mobiflix_sub_scale', currentScale); } catch(e) {}
      }

      window.changeSubtitleSize = function(direction) {
        currentScale += direction * STEP;
        if (currentScale < MIN_SCALE) currentScale = MIN_SCALE;
        if (currentScale > MAX_SCALE) currentScale = MAX_SCALE;
        applyScale();
      };

      try {
        const saved = parseFloat(localStorage.getItem('mobiflix_sub_scale'));
        if (!isNaN(saved) && saved >= MIN_SCALE && saved <= MAX_SCALE) {
          currentScale = saved;
        }
      } catch(e) {}

      applyScale();

      function sendSubtitleCommands() {
        try {
          const commands = [
            { type: 'setSubtitle', lang: 'en', enabled: true },
            { type: 'subtitle', enabled: true, lang: 'en' },
            { type: 'enableSubtitle', lang: 'en' },
            { type: 'cc', enabled: true, lang: 'en' },
            { type: 'captions', enabled: true, lang: 'en' },
            { action: 'setSubtitle', language: 'en' },
            { type: 'play' }
          ];
          commands.forEach(function(cmd) {
            try { frame.contentWindow.postMessage(cmd, '*'); } catch (e) {}
          });
        } catch (e) {}
      }

      frame.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('loading-overlay').classList.add('hidden');
        }, 600);

        sendSubtitleCommands();
        setTimeout(sendSubtitleCommands, 1500);
        setTimeout(sendSubtitleCommands, 3000);
        setTimeout(sendSubtitleCommands, 5000);

        setTimeout(function() {
          document.getElementById('player-back-btn').classList.add('visible');
          document.getElementById('subtitle-controls').classList.add('visible');
        }, 2000);
      });

      setTimeout(function() {
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('player-back-btn').classList.add('visible');
        document.getElementById('subtitle-controls').classList.add('visible');
      }, 4000);

      window.addEventListener('message', function(event) {
        const data = event.data;
        if (!data) return;
        if (typeof data === 'object') {
          if (data.event === 'ready' || data.type === 'ready') {
            sendSubtitleCommands();
          }
        }
      });

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }

      window.goBackFromPlayer = function() {
        if (document.referrer && document.referrer.indexOf(location.host) !== -1) {
          history.back();
        } else {
          const detailType = type === 'tv' ? 'tv' : 'movie';
          window.location.href = `details.html?id=${id}&type=${detailType}`;
        }
      };

      console.log('[MobiFlix Player] Embed URL:', embedURL);
    })();
  </script>
</body>
</html>
